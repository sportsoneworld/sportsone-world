#
#  HOW TO NAME A STORY
#    Use the article's slug — the last part of its web address.
#      /posts/second-test-day-two-collapse/   ->   second-test-day-two-collapse
#    The file name without ".md" also works.
#
#  IF YOU LEAVE A SLOT SHORT
