# =============================================================================
#  HOMEPAGE — WHAT THE DESK PUTS WHERE
#
#  This is the running order of the SportsOne front page. Change a line here,
#  save, and the homepage changes. You never edit a template.
#
#  HOW TO NAME A STORY
#    Use the article's slug — the last part of its web address.
#      /posts/second-test-day-two-collapse/   ->   second-test-day-two-collapse
#    The file name without ".md" also works.
#
#  IF YOU LEAVE A SLOT SHORT
#    The page fills the gap with the newest published story that is not
#    already somewhere else on the page, so the front page is never half
#    empty and a story never appears twice. Your choices always come first.
#
#  IF YOU MISSPELL A SLUG
#    That line is ignored and the gap is filled as above. Nothing breaks.
# =============================================================================

# -----------------------------------------------------------------------------
# SPOTLIGHT — the five stories at the very top of the page.
# They rotate on their own every five seconds, in the order written here.
# These are the desk's picks, not simply the five most recent stories.
# -----------------------------------------------------------------------------
