  - federer-nadal-2008                 # Spotlight story 3
  - gabba-2021-india                   # Spotlight story 4
  - miracle-on-ice-1980                # Spotlight story 5

# -----------------------------------------------------------------------------
# TOP STORIES — one big panel on the left, four stories stacked beside it.
#
