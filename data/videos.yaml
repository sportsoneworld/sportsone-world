# =============================================================================
#  VIDEO
#
#  Three videos at the foot of each sport page. The key of each block is that
#  sport's category slug, the same as in data/sports.yaml.
#
#  TO ADD ONE     copy a block and change the four lines.
#  TO REMOVE ONE  delete its block. A sport with no block simply has no video
#                 section, and nothing else on the page moves.
#
#    id       the part of a YouTube address after "watch?v="
#    title    what the video is called
#    channel  who published it — printed as the credit under the video
#    url      the channel's page, so the credit is clickable
#
#  Nothing is requested from YouTube until a reader actually clicks play. The
#  still image is the only thing loaded up front, and it is lazy-loaded.
# =============================================================================

