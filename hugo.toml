# =============================================================================
#  SportsOne — Hugo configuration
#  This is the ONLY configuration file you need to touch.
#  Every setting is commented in plain English. See docs/03-tools-and-dependencies.md
# =============================================================================

baseURL           = "https://sportsone.world/"
title             = "SportsOne"
locale            = "en-IN"
defaultContentLanguage = "en"
enableRobotsTXT   = true
enableEmoji       = true
timeZone          = "Asia/Kolkata"

# Articles dated in the future stay hidden until a build runs after that date.
buildDrafts  = false
buildFuture  = false
buildExpired = false

# Clean URLs: /posts/messi-scores-hattrick/ regardless of which sport folder
# the Markdown file lives in.
[permalinks]
  [permalinks.page]
    posts = "/posts/:slug/"
  [permalinks.section]
    posts = "/posts/"

# Articles per page on every listing. Feeds run two to a row, so ten is five
# full rows and then the pager.
[pagination]
  pagerSize = 10

# -----------------------------------------------------------------------------
# Taxonomies — the metadata that groups articles together.
# Add a new value in an article's front matter and Hugo builds the page for it.
# -----------------------------------------------------------------------------
[taxonomies]
  category = "categories"
  tag      = "tags"
  author   = "authors"

# -----------------------------------------------------------------------------
# Output formats
#   HTML — the website
#   RSS  — feeds for readers and aggregators
#   JSON — the search index used by /search/
# -----------------------------------------------------------------------------
[outputs]
  home     = ["html", "rss", "json"]
  section  = ["html", "rss"]
  taxonomy = ["html", "rss"]
  term     = ["html", "rss"]
  page     = ["html"]

[outputFormats]
  [outputFormats.RSS]
    mediaType = "application/rss+xml"
    baseName  = "index"

# Which date field wins, and in what order Hugo looks for it.
[frontmatter]
  date         = ["date", "publishDate"]
  lastmod      = ["lastmod", "updated", "date"]
  publishDate  = ["publishDate", "date"]
  expiryDate   = ["expiryDate", "unpublishDate"]

[services]
  [services.rss]
    limit = 30

# How "Related stories" at the foot of an article are chosen.
[related]
  includeNewer = true
  threshold    = 20
  toLower      = true
  [[related.indices]]
    name   = "categories"
    weight = 100
  [[related.indices]]
    name   = "tags"
    weight = 80
  [[related.indices]]
    name   = "date"
    weight = 10

[sitemap]
  changefreq = "hourly"
  filename   = "sitemap.xml"
  priority   = 0.6

# -----------------------------------------------------------------------------
# Markdown behaviour
# -----------------------------------------------------------------------------
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Allows raw HTML inside Markdown. You never need it, but it means an
      # embedded video or table will not silently disappear.
      unsafe = true
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.extensions]
      linkify   = true
      strikethrough = true
      table     = true
      typographer = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false
  [markup.highlight]
    noClasses = false
    lineNos   = false

# -----------------------------------------------------------------------------
# Minification applied by `hugo --minify` (the production build)
# -----------------------------------------------------------------------------
[minify]
  disableHTML = false
  [minify.tdewolff.html]
    keepDocumentTags = true
    keepEndTags      = true
    keepQuotes       = true

# =============================================================================
#  SITE PARAMETERS
# =============================================================================
[params]
  # --- Identity -------------------------------------------------------------
  # The brand shown to readers is SportsOne. sportsone.world is only the
  # address the site is published at — it is not the name of the newsroom and
  # should not appear in headings, taglines or promotional copy.
  brandName      = "SportsOne"
  brandDomain    = "sportsone.world"
  description    = "SportsOne — an independent sports newsroom. Football, cricket, tennis, basketball, motorsport and athletics: news, analysis, match coverage and live scores."
  keywords       = ["sports news", "live scores", "match reports", "cricket", "football", "tennis", "basketball", "motorsport"]
  publisherName  = "SportsOne"
  defaultAuthor  = "SportsOne Desk"

  # --- Logo & default imagery ----------------------------------------------
  # Two marks, one per system theme. The browser picks; there is no script and
  # no flash of the wrong one.
  logoLight      = "/images/brand/sportsone-mark-light.png"  # light mode
  logoDark       = "/images/brand/sportsone-mark-dark.png"   # dark mode
  logoSquare     = "/images/brand/sportsone-mark-dark-512.png"
  # Used whenever an article has no image of its own.
  fallbackImage  = "/images/placeholder.svg"
  # Used for social sharing cards on pages that are not articles.
  defaultOgImage = "/images/brand/sportsone-og.png"

  # --- Article furniture -----------------------------------------------------
  showShareButtons = true
  relatedCount   = 4

  # --- Live scores -----------------------------------------------------------
  # Scores refresh automatically — see data/scores-source.yaml. Which ones lead
  # the front page is still the desk's call, via `featured_matches` in
  # data/scores.yaml. Set showLiveScores to false to remove scores site-wide.
  showLiveScores = true
  # How many matches the horizontal strip carries at most.
  scoreStripCount = 8

  # --- Social profiles -------------------------------------------------------
  # PLACEHOLDERS — confirm these accounts before launch. Full profile URLs, so
  # the footer never has to build one. Leave a line blank to hide that icon.
  [params.social]
    twitter   = "https://x.com/sportsoneworld"
    instagram = "https://instagram.com/sportsoneworld"
    facebook  = ""
    youtube   = ""

  # --- Footer ----------------------------------------------------------------
  [params.footer]
    about = "An independent sports newsroom. Football, cricket, tennis, basketball, motorsport and athletics — news, analysis, match coverage and live scores."
    copyrightHolder = "SportsOne"

# =============================================================================
#  NAVIGATION lives in data/navigation.yaml, not here.
#
#  That one file drives the toolbar, the Cricket and Football dropdowns, the
#  mobile menu and all three footer columns, so the navigation can never
#  disagree with itself. Hugo menus are deliberately not used.
# =============================================================================
